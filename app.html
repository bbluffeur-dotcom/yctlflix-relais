<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>Yctlflix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
<style>
:root{--bg:#0a0908;--bg2:#13100d;--card:#17130f;--line:#2b241b;--tx:#F1EEE7;--mu:#a39a8a;--g1:#C9A057;--g2:#F2DCA8;--g:#D8B46A;--ko:#e57373;--ok:#7bc47f;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Archivo,system-ui,Segoe UI,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:#0e0c0a;border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none}
input:focus,select:focus{border-color:var(--g1)}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.gold{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:600;background:linear-gradient(90deg,var(--g1),var(--g2));color:#14110e}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:13px}
.mu{color:var(--mu)}.err{color:var(--ko)}
.hide{display:none!important}
/* écrans plein cadre */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.center h1{font-size:54px;margin:0}
.panel{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
/* profils */
.profiles{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:820px}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:120px}
.avatar{width:104px;height:104px;border-radius:26px;display:grid;place-items:center;font:600 44px 'Cormorant Garamond',serif;color:#14110e;transition:transform .15s,box-shadow .15s}
.prof:hover .avatar{transform:scale(1.07);box-shadow:0 0 0 3px var(--g2)}
.kidtag{font-size:11px;border:1px solid var(--g1);color:var(--g2);border-radius:99px;padding:0 8px}
/* barre du haut */
header.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:22px;padding:12px 4vw;background:linear-gradient(#0a0908ee,#0a090800);backdrop-filter:blur(2px)}
header.top.solid{background:#0a0908f2}
.logo{font:700 30px 'Cormorant Garamond',serif;letter-spacing:.5px}
nav.main{display:flex;gap:4px;flex:1;overflow:auto;scrollbar-width:none}
nav.main a{color:var(--mu);text-decoration:none;padding:7px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
nav.main a.on,nav.main a:hover{color:var(--tx)}nav.main a.on{background:rgba(255,255,255,.08)}
.iconbtn{background:none;border:0;padding:6px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatar.sm{width:34px;height:34px;border-radius:10px;font-size:18px}
.menu{position:fixed;right:4vw;top:58px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:200px;box-shadow:0 14px 40px #000a}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 14px}.menu button:hover{background:rgba(255,255,255,.08)}
main{padding-top:70px;min-height:100vh}
/* héros */
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;padding:0 4vw 48px;margin-top:-70px;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(26px) brightness(.5) saturate(1.2);transform:scale(1.15)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0,#0a090800 55%),linear-gradient(90deg,#0a0908cc,#0a090800 70%)}
.hero .in{position:relative;display:flex;gap:34px;align-items:flex-end;width:100%;max-width:1200px}
.hero img{width:200px;aspect-ratio:2/3;object-fit:cover;border-radius:var(--r);box-shadow:0 20px 60px #000c;flex:none}
.hero h2{font:700 clamp(34px,5vw,64px)/1.05 'Cormorant Garamond',serif;margin:0 0 10px}
.hero .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
/* rangées et grilles */
.rail{padding:18px 0 4px}.rail h3{font:600 26px 'Cormorant Garamond',serif;margin:0 4vw 10px}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 4vw 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#3a3126 transparent}
.row .card{flex:none;width:156px;scroll-snap-align:start}.row .card.live{width:210px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:10px 4vw 60px}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:none;border:0;padding:0;text-align:left;display:block;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#241d15,#14110d);transition:transform .18s,box-shadow .18s}
.card.live .poster{aspect-ratio:16/10}
.card.live .poster img{object-fit:contain;padding:14px}
.card:hover .poster{transform:scale(1.05);box-shadow:0 0 0 2px var(--g1),0 14px 34px #000a}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font:600 34px 'Cormorant Garamond',serif;color:#5b4d36;padding:8px;text-align:center}
.ctitle{margin-top:7px;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src{position:absolute;left:7px;top:7px;font-size:10.5px;background:#000a;border-radius:99px;padding:1px 8px;color:var(--g2)}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0008}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2))}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 4vw 4px}
.bar h1{font:700 40px 'Cormorant Garamond',serif;margin:0 14px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-size:13px;color:var(--mu)}
.chip.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#14110e;border-color:transparent;font-weight:600}
.state{padding:40px 4vw;text-align:center}
.spin{width:34px;height:34px;border:3px solid #3a3126;border-top-color:var(--g2);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* recherche */
.search{display:flex;gap:10px;padding:16px 4vw 0}.search input{flex:1;max-width:560px}
/* fiche */
.modal{position:fixed;inset:0;z-index:40;background:#000c;display:grid;place-items:center;padding:3vh 3vw;overflow:auto}
.sheet{width:min(920px,100%);max-height:94vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:26px;position:relative}
.sheet .head{display:flex;gap:26px;padding:28px;flex-wrap:wrap}
.sheet .head img{width:190px;aspect-ratio:2/3;object-fit:cover;border-radius:16px;flex:none;background:#241d15}
.sheet h2{font:700 40px/1.05 'Cormorant Garamond',serif;margin:0 0 8px}
.sheet .x{position:absolute;right:14px;top:14px;z-index:2;background:#0008}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin-bottom:10px}
.plot{color:#d8d2c6;max-width:60ch}
.eps{padding:0 28px 28px}.ep{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ep b{width:34px;color:var(--g)}.ep span{flex:1}.ep .mu{font-size:12.5px}
/* lecteur */
.player{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;user-select:none}
.player video{width:100%;height:100%;background:#000;object-fit:contain}
.player .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;background:linear-gradient(#000a,#0000 22%,#0000 70%,#000c)}
.player.idle .ov{opacity:0;cursor:none}.player.idle .banner{opacity:1}
.ov .t{display:flex;gap:14px;align-items:center;padding:16px 22px}.ov .t .ttl{font:600 26px 'Cormorant Garamond',serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .b{padding:0 22px 18px}.ctl{display:flex;align-items:center;gap:6px;margin-top:6px}.ctl .sp{flex:1}
.seek{display:flex;align-items:center;gap:12px;font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:9px;background:#fff3;padding:0;border:0;flex:1;min-width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--g2)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--g2)}
.vol{width:90px;flex:none}
.centerbox{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:30px;pointer-events:none}
.centerbox>*{pointer-events:auto}.centerbox .msg{max-width:520px;font-size:17px}
.banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000b;border:1px solid var(--g1);color:var(--g2);padding:8px 18px;border-radius:99px;font-size:14px;display:flex;gap:10px;align-items:center;pointer-events:auto;z-index:3}
.pmenu{position:absolute;right:22px;bottom:96px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;max-height:50vh;overflow:auto}
.pmenu h4{margin:8px 12px 4px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.pmenu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 12px}.pmenu button:hover{background:#fff1}.pmenu button.on{color:var(--g2)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c1710;border:1px solid var(--g1);border-radius:14px;padding:11px 18px;z-index:90;display:none;max-width:90vw}
@media(max-width:640px){.hero img{display:none}.vol{display:none}.sheet .head{padding:18px}.sheet .head img{width:120px}.logo{font-size:24px}.ov .t .ttl{font-size:20px}}
</style></head><body>
<div id="root"></div><div id="toast"></div>
<script>
'use strict';
/* ====================== utilitaires ====================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const dev = LS.get('ydev') || (() => { const v = Math.random().toString(36).slice(2) + Date.now().toString(36); LS.set('ydev', v); return v; })();
const S = { code: LS.get('ycode'), me: null, profile: null, counts: null, favs: new Map(), hist: new Map(), view: null };
const fmtTime = (t) => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const key = (it) => `${it.src}/${it.type}/${it.id}`;
const COLORS = ['#C9A057', '#D8B46A', '#b88a8a', '#8aa6b8', '#9bb88a', '#b88ac2', '#e0a070'];
let toastT; function toast(m, ms = 4500) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
const ICON = {
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  play: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  back10: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="8" y="16" font-size="7" stroke="none" fill="currentColor">10</text></svg>',
  fwd10: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><text x="8" y="16" font-size="7" stroke="none" fill="currentColor">10</text></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6m0-6-5 6"/></svg>',
  full: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  pip: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor"/></svg>',
  tracks: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 12h3M7 15h6M14 12h3"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',
};

/* ====================== accès au relais ====================== */
async function api(path, { method = 'GET', body, signal } = {}) {
  let r;
  try {
    r = await fetch(path, { method, signal, body: body ? JSON.stringify(body) : undefined,
      headers: { 'X-Code': S.code || '', 'X-Device': dev, 'X-Profile': S.profile ? S.profile.id : '', ...(body ? { 'Content-Type': 'application/json' } : {}) } });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw Object.assign(new Error('Le serveur ne répond pas. Vérifiez que l\'ordinateur du relais est allumé.'), { offline: true });
  }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(j?.error || ('Erreur ' + r.status)), { status: r.status });
  return j;
}

/* ====================== écrans de départ ====================== */
const root = $('#root');
function mount(html) { root.innerHTML = html; return root; }

function showOffline(msg) {
  mount(`<div class="center"><h1 class="serif gold">Yctlflix</h1><p class="mu" style="max-width:420px">${esc(msg || 'Le catalogue est hors ligne pour le moment.')}</p><button class="btn" id="retry">Réessayer</button></div>`);
  $('#retry').onclick = boot;
}
function showLogin(msg) {
  mount(`<div class="center"><h1 class="serif gold">Yctlflix</h1><p class="mu">Entrez votre code d'accès</p>
    <form class="panel" id="f"><input id="code" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-align:center;letter-spacing:.08em">
    <button class="btn" type="submit">Entrer</button><div id="m" class="err">${esc(msg || '')}</div></form>
    <p class="mu" style="font-size:13px;max-width:380px">Pas de code ? Demandez-en un à l'administrateur.</p></div>`);
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); S.code = $('#code').value.trim();
    if (!S.code) return;
    try { S.me = await api('/api/me'); LS.set('ycode', S.code); LS.del('yprofile'); S.profile = null; showProfiles(); }
    catch (err) { $('#m').textContent = err.status === 401 ? 'Code invalide ou désactivé.' : err.message; S.code = null; }
  };
}
async function showProfiles(manage = false) {
  let list;
  try { list = await api('/api/profiles'); } catch (e) { return e.status === 401 ? (LS.del('ycode'), showLogin('Votre code d\'accès n\'est plus valable. Contactez l\'administrateur.')) : showOffline(e.message); }
  const max = S.me?.maxProfiles ?? 5, canAdd = max < 0 || list.length < max;
  mount(`<div class="center"><h1 class="serif gold" style="font-size:44px">Qui regarde ?</h1>
    <div class="profiles">${list.map(p => `<button class="prof" data-id="${p.id}"><div class="avatar" style="background:${esc(p.color)}">${esc(p.name[0].toUpperCase())}</div><span>${esc(p.name)}</span>${p.kids ? '<span class="kidtag">Enfants</span>' : ''}${manage ? '<span class="err" style="font-size:12px">Supprimer</span>' : ''}</button>`).join('')}
    ${canAdd ? `<button class="prof" id="add"><div class="avatar" style="background:#241d15;color:var(--g2)">+</div><span>Ajouter</span></button>` : ''}</div>
    <button class="btn ghost sm" id="manage">${manage ? 'Terminé' : 'Gérer les profils'}</button>
    <button class="btn ghost sm" id="out">Changer de code</button></div>`);
  root.querySelectorAll('.prof[data-id]').forEach(b => b.onclick = async () => {
    const p = list.find(x => x.id == b.dataset.id);
    if (manage) { if (confirm(`Supprimer le profil « ${p.name} » ?`)) { try { await api('/api/profiles/' + p.id, { method: 'DELETE' }); } catch (e) { toast(e.message); } showProfiles(true); } return; }
    chooseProfile(p);
  });
  $('#manage').onclick = () => showProfiles(!manage);
  $('#out').onclick = () => { LS.del('ycode'); LS.del('yprofile'); S.code = null; S.profile = null; showLogin(); };
  if ($('#add')) $('#add').onclick = () => {
    mount(`<div class="center"><h1 class="serif gold" style="font-size:40px">Nouveau profil</h1><form class="panel" id="f"><input id="n" maxlength="24" placeholder="Prénom" autocomplete="off">
      <label style="display:flex;gap:10px;align-items:center;justify-content:center"><input type="checkbox" id="k" style="width:auto"> Profil enfants (catalogue restreint)</label>
      <button class="btn" type="submit">Créer</button><button class="btn ghost" type="button" id="c">Annuler</button><div id="m" class="err"></div></form></div>`);
    $('#c').onclick = () => showProfiles();
    $('#f').onsubmit = async (e) => { e.preventDefault(); try { await api('/api/profiles', { method: 'POST', body: { name: $('#n').value, kids: $('#k').checked, color: COLORS[list.length % COLORS.length] } }); showProfiles(); } catch (err) { $('#m').textContent = err.message; } };
  };
}
async function chooseProfile(p) {
  S.profile = p; LS.set('yprofile', String(p.id));
  S.favs = new Map(); S.hist = new Map();
  try {
    const [f, h] = await Promise.all([api('/api/favs?profile=' + p.id), api('/api/hist?profile=' + p.id)]);
    f.forEach(x => S.favs.set(key(x), x)); h.forEach(x => S.hist.set(key(x), x));
  } catch {}
  shell(); go(location.hash || '#/home', true);
}

/* ====================== coque et navigation ====================== */
function shell() {
  const kids = S.profile.kids;
  mount(`<header class="top" id="top"><div class="logo serif gold">Yctlflix</div>
    <nav class="main"><a data-h="#/home">Accueil</a><a data-h="#/films">Films</a><a data-h="#/series">Séries</a>${kids ? '' : '<a data-h="#/direct">Direct</a>'}<a data-h="#/liste">Ma liste</a></nav>
    <button class="iconbtn" id="sbtn" title="Rechercher">${ICON.search}</button>
    <button class="iconbtn" id="pbtn" title="Profil"><div class="avatar sm" style="background:${esc(S.profile.color)}">${esc(S.profile.name[0].toUpperCase())}</div></button></header>
    <main id="main"></main>`);
  root.querySelectorAll('nav.main a').forEach(a => a.onclick = () => { location.hash = a.dataset.h; });
  $('#sbtn').onclick = () => { location.hash = '#/search'; };
  $('#pbtn').onclick = (e) => {
    e.stopPropagation(); const old = $('.menu'); if (old) return old.remove();
    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = `<button id="m1">Changer de profil</button><button id="m2">Quitter (changer de code)</button>`;
    document.body.appendChild(m);
    $('#m1').onclick = () => { m.remove(); LS.del('yprofile'); S.profile = null; showProfiles(); };
    $('#m2').onclick = () => { m.remove(); LS.del('ycode'); LS.del('yprofile'); S.code = null; S.profile = null; showLogin(); };
    setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }));
  };
  window.addEventListener('scroll', () => $('#top')?.classList.toggle('solid', scrollY > 40), { passive: true });
}
window.addEventListener('hashchange', () => { if (S.profile) go(location.hash); });
function go(h, force) {
  if (!S.profile) return;
  const route = (h || '#/home').split('?')[0];
  root.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('on', a.dataset.h === route));
  S.view?.stop?.(); S.view = null; scrollTo(0, 0);
  const m = $('#main');
  const R = { '#/home': viewHome, '#/films': () => viewBrowse('film'), '#/series': () => viewBrowse('serie'), '#/direct': () => viewBrowse('chaine'), '#/liste': viewList, '#/search': viewSearch };
  if (S.profile.kids && route === '#/direct') return (location.hash = '#/home');
  (R[route] || viewHome)(m);
}
const loading = () => '<div class="state"><div class="spin"></div></div>';

function makeGrid(box, foot, urlOf, empty = 'Rien à afficher ici.') {
  let offset = 0, busy = false, done = false, tok = 0, ctrl = null, first = true;
  const io = new IntersectionObserver(() => check(), { rootMargin: '1600px' }); io.observe(foot);
  const onScroll = () => check(); addEventListener('scroll', onScroll, { passive: true });
  function check() { if (!busy && !done && foot.isConnected && foot.getBoundingClientRect().top < innerHeight + 1600) load(); }
  async function load() {
    busy = true; const my = tok; ctrl = new AbortController();
    if (first) foot.innerHTML = loading();
    try {
      const j = await api(urlOf(offset), { signal: ctrl.signal });
      if (my !== tok) return;
      j.items.forEach(i => box.appendChild(card(i, resumeOf(i))));
      offset += j.items.length; if (j.items.length < 60) done = true;
      if (first && !j.items.length) foot.innerHTML = `<div class="state mu">${esc(empty)}</div>`; else foot.innerHTML = '';
      first = false;
    } catch (e) {
      if (e.name === 'AbortError') return;
      foot.innerHTML = errBox(e.message, 'gr'); $('#gr').onclick = () => { foot.innerHTML = ''; busy = false; load(); }; return;
    } finally { if (my === tok) busy = false; }
    setTimeout(check, 0);
  }
  return {
    reset() { tok++; ctrl?.abort(); box.innerHTML = ''; foot.innerHTML = ''; offset = 0; done = false; busy = false; first = true; load(); },
    stop() { tok++; ctrl?.abort(); io.disconnect(); removeEventListener('scroll', onScroll); },
  };
}

const LANG = { fre: 'fr', fra: 'fr', eng: 'en', ger: 'de', deu: 'de', spa: 'es', ita: 'it', por: 'pt', ara: 'ar', jpn: 'ja', kor: 'ko', rus: 'ru', tur: 'tr', dut: 'nl', nld: 'nl', pol: 'pl', chi: 'zh', zho: 'zh', und: '' };
function langName(code) {
  if (!code) return null; const c = LANG[code] ?? code; if (!c) return null;
  try { const n = new Intl.DisplayNames(['fr'], { type: 'language' }).of(c); if (n && n !== c) return n.charAt(0).toUpperCase() + n.slice(1); } catch {}
  return code.toUpperCase();
}
const isFr = (l) => ['fr', 'fre', 'fra'].includes(String(l || '').toLowerCase());
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function openPlayer(o) {
  closePlayer();
  const el = document.createElement('div'); el.className = 'player';
  el.innerHTML = `<video playsinline preload="auto"></video>
    <div class="ov"><div class="t"><button class="iconbtn" data-a="close" title="Fermer">${ICON.close}</button><div class="ttl">${esc(o.title)}</div></div>
    <div class="b"><div class="seek"><span id="tc">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">0:00</span></div>
    <div class="ctl"><button class="iconbtn" data-a="pp" id="pp">${ICON.pause}</button><button class="iconbtn" data-a="b10">${ICON.back10}</button><button class="iconbtn" data-a="f10">${ICON.fwd10}</button>
    <button class="iconbtn" data-a="mute" id="mb">${ICON.vol}</button><input type="range" class="vol" id="vl" min="0" max="100" value="100"><span class="sp"></span>
    <button class="iconbtn" data-a="tracks" title="Langue et sous-titres">${ICON.tracks}</button><button class="iconbtn" data-a="pip" title="Image dans l'image">${ICON.pip}</button><button class="iconbtn" data-a="full" title="Plein écran">${ICON.full}</button></div></div></div>
    <div class="centerbox" id="cb"></div><div class="banner hide" id="bn"></div>`;
  document.body.appendChild(el);
  const v = $('video', el), live = o.type === 'chaine';
  const P = { ticket: null, probe: null, mode: null, offset: 0, hls: null, hlsErr: 0, retries: 0, gen: 0, state: 'loading', audioIdx: 0, subIdx: -1, startT: 0, timers: [], released: false, userPaused: false, tried: new Set() };
  const setT = (f, ms) => { const t = setTimeout(f, ms); P.timers.push(t); return t; };
  const clearTimers = () => { P.timers.forEach(clearTimeout); P.timers = []; };
  const cb = $('#cb', el), bn = $('#bn', el);
  const centre = (html) => { cb.innerHTML = html; };
  const banner = (txt, btn) => { if (!txt) return bn.classList.add('hide'); bn.classList.remove('hide'); bn.innerHTML = `<span>${esc(txt)}</span>${btn ? `<button class="btn sm" id="bb">${esc(btn[0])}</button>` : ''}`; if (btn) $('#bb', bn).onclick = btn[1]; };
  const showLoading = () => { P.state = 'loading'; centre('<div class="spin"></div>'); };
  const showError = (msg, canRetry = true) => { P.state = 'error'; clearTimers(); centre(`<div class="msg">${esc(msg)}</div><div style="display:flex;gap:10px">${canRetry ? '<button class="btn" id="re">Réessayer</button>' : ''}<button class="btn ghost" id="cl">Fermer</button></div>`);
    $('#re', cb)?.addEventListener('click', () => start(P.curPos())); $('#cl', cb).onclick = () => api_close(); };
  const api_close = () => { saveHist(true); closePlayer(); };
  const isFF = () => P.mode === 'ff' || P.mode === 'ffh';
  P.curPos = () => isFF() ? P.offset + (v.currentTime || 0) : (v.currentTime || 0);
  P.duration = () => isFF() ? (P.probe?.duration || 0) : (isFinite(v.duration) ? v.duration : (P.probe?.duration || 0));

  /* ---- historique ---- */
  let lastSave = 0;
  function saveHist(force) {
    if (live || !o.hist || !S.profile) return; const pos = P.curPos(), dur = P.duration();
    if (!force && Date.now() - lastSave < 15000) return; if (pos < 5 && !force) return; lastSave = Date.now();
    if (pos < 5) return;
    const body = { profile: S.profile.id, src: o.src, type: o.hist.type, id: o.hist.id, title: o.hist.seriesTitle || o.title, img: o.img, pos, dur, meta: o.hist.meta || null };
    const done = dur > 60 && pos / dur > 0.95;
    const k = `${o.src}/${o.hist.type}/${o.hist.id}`;
    if (done) { S.hist.delete(k); fetch(`/api/hist?profile=${S.profile.id}&src=${o.src}&type=${o.hist.type}&id=${encodeURIComponent(o.hist.id)}`, { method: 'DELETE', keepalive: true, headers: { 'X-Code': S.code, 'X-Device': dev } }); return; }
    S.hist.set(k, { src: o.src, type: o.hist.type, id: o.hist.id, title: body.title, img: o.img, pos, dur, meta: body.meta, ts: Date.now() });
    fetch('/api/hist', { method: 'POST', keepalive: true, headers: { 'X-Code': S.code, 'X-Device': dev, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  }
  P.release = (ka) => { if (P.released || !P.ticket) return; P.released = true; fetch('/api/release', { method: 'POST', keepalive: ka, headers: { 'X-Code': S.code, 'X-Device': dev, 'Content-Type': 'application/json' }, body: JSON.stringify({ n: P.ticket.n }) }).catch(() => {}); };

  /* ---- arrêt propre d'une lecture (avant de changer de mode ou de relancer) ---- */
  function teardown() {

    try { v.pause(); } catch {} v.removeAttribute('src'); try { v.load(); } catch {}
    banner(null);
  }
  /* ---- démarrage : ticket, analyse, choix du mode ---- */
  async function start(pos = 0) {
    teardown(); showLoading(); const gen = P.gen;
    try {
      if (!P.ticket) {
        P.ticket = await api('/api/ticket', { method: 'POST', body: { src: o.src, type: o.type, id: o.id, ext: o.ext, device: dev } });
        P.released = false;
      }
      if (gen !== P.gen) return;
      if (P.ticket.ffmpeg && !P.probe && !P.probeFailed) {
        try { P.probe = await (await fetch(P.ticket.probe)).json(); if (P.probe.error) { P.probe = null; P.probeFailed = true; } } catch { P.probeFailed = true; }
      }
      if (gen !== P.gen) return;
      decide(pos);
    } catch (e) {
